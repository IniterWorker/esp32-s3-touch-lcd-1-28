[package]
edition      = "2024"
name         = "esp32-s3-touch-lcd-1-28"
rust-version = "1.95"
version      = "0.1.0"

[[bin]]
name              = "blocking"
path              = "./src/bin/blocking.rs"
required-features = ["board"]

[[bin]]
name              = "embassy_async"
path              = "./src/bin/embassy_async.rs"
required-features = ["board"]

[features]
default = ["board"]
# Everything ESP32-S3-specific. Without it, only the pure test-card drawing
# core builds (and its host tests run): `cargo test --lib --no-default-features`.
board = [
  "dep:critical-section",
  "dep:embassy-executor",
  "dep:embassy-time",
  "dep:embedded-hal-bus",
  "dep:esp-backtrace",
  "dep:esp-bootloader-esp-idf",
  "dep:esp-hal",
  "dep:esp-println",
  "dep:esp-rtos",
  "dep:gc9a01-rs",
  "dep:log",
  "dep:static_cell",
]

[dependencies]
embedded-graphics = "0.8"
embedded-hal      = "1.0"
embedded-hal-async = "1.0"

# Local, unpublished 0.5.0. After 0.5.0 publishes:
# gc9a01-rs = { version = "0.5.0", features = ["async", "graphics"], optional = true }
gc9a01-rs = { path = "../gc9a01", version = "0.5.0", features = ["async", "graphics"], optional = true }
embedded-hal-bus = { version = "0.3", features = ["async"], optional = true }
# Versions below are copied verbatim from esp-generate 2.0.0
# (esp32s3 + unstable-hal + embassy + log + esp-backtrace); do not hand-bump
# individual crates — regenerate and re-copy as a set.
esp-hal = { version = "~1.2.2", features = ["esp32s3", "log-04", "unstable"], optional = true }

esp-rtos = { version = "0.4.0", features = ["embassy", "esp32s3", "log-04"], optional = true }

esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"], optional = true }
log                    = { version = "0.4.27", optional = true }

embassy-executor = { version = "0.10.0", features = ["log"], optional = true }
embassy-time     = { version = "0.5.0", features = ["log"], optional = true }
esp-backtrace    = { version = "0.20.0", features = ["esp32s3", "panic-handler", "println"], optional = true }
esp-println      = { version = "0.18.0", features = ["esp32s3", "log-04"], optional = true }

critical-section = { version = "1.2.0", optional = true }
static_cell      = { version = "2.1.1", optional = true }

[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1 # LLVM can perform better optimizations using a single thread
debug         = 2 # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
