name: Continuous Integration

on:
  push:
    paths-ignore:
      - "**/README.md"
  pull_request:
  workflow_dispatch:

# CI runs the only hardware-free gate: the Nix sandbox host tests of the
# pure test-card core (nix flake check). Firmware builds need the impure
# Xtensa `esp` toolchain and the real panel; they are devShell/HIL gates
# (`just build`, `just hil`), not CI jobs.
jobs:
  nix-check:
    name: Nix flake check + fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Flake check (host lib tests)
        run: nix flake check
      - name: Format check
        run: nix develop -c cargo fmt --all -- --check
